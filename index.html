<!DOCTYPE html>
<html lang="en">
<head>

    <title>저녁 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="theme-switch-wrapper">

        </div>
        <h1>저녁 메뉴 추천</h1>

            <img id="menu-image" src="" alt="Dinner Menu Image">
            <div id="menu-name"></div>
        </div>
        <button id="generate">메뉴 추천</button>
    </div>
    <script src="menu.js"></script>
    <script src="main.js"></script>
</body>
</html>
